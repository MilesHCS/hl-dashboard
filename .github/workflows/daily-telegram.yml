name: Send dashboard reports to Telegram
on:
  workflow_run:
    workflows: ['Daily whale dashboard']
    types: [completed]
permissions:
  contents: read
jobs:
  telegram:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Deliver each address report when Telegram is paired
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { TELEGRAM_BOT_TOKEN: token, TELEGRAM_CHAT_ID: chat } = process.env;
          if (!token || !chat) { console.log('Telegram credentials not configured'); process.exit(0); }
          const reports = JSON.parse(fs.readFileSync('analysis/latest.json','utf8'));
          const time = value => new Date(value).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});
          for (const [address, entry] of Object.entries(reports)) {
            const text = [(entry.name || address)+'｜每日持倉分析',time(entry.updatedAt)+' 台灣時間',entry.report].join('\n');
            const response = await fetch('https://api.telegram.org/bot'+token+'/sendMessage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_id:chat,text})});
            const result = await response.json();
            if (!response.ok || !result.result?.message_id) throw Error('Telegram delivery failed: '+response.status);
          }
          JS
